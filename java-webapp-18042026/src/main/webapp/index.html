<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<!-- <form action="processinput"> -->
	
	<form action="processinput" method="post">
	
		First Name <input type="text" name="fname"><br>
		Last Name <input type="text" name="lname"><br>
		Mobile Number <input type="number" name="mobnum"><br>
		Email Address <input type="email" name="emadd"><br>
		Login Password <input type="password" name="pass"><br>
		
		Gender<br>
		<input type="radio" name="gen" value="male"> Male<br>
		<input type="radio" name="gen" value="female"> Female<br>
		
		Qualifications<br>
		<input type="checkbox" name="qual" value="diploma"> Diploma<br>
		<input type="checkbox" name="qual" value="graduate"> Graduate<br>
		<input type="checkbox" name="qual" value="post-graduate"> Post Graduate<br>
		
		Country
		<select name="cntr">
			<option>India</option>
			<option>Australia</option>
			<option>Japan</option>
		</select><br>
		
		Address <textarea name="addr"></textarea><br>
		<button type="reset">Clear</button>
		<button type="submit">Proceed</button>
	</form>
</body>
</html>
