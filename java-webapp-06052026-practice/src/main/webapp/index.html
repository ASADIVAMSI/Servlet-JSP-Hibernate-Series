<html>
<head>
<meta charset="UTF-8">
<title>Employee Management</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        width: 450px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 25px;
    }

    a {
        display: block;
        text-decoration: none;
        background: #007BFF;
        color: white;
        padding: 14px;
        margin: 12px 0;
        border-radius: 8px;
        font-size: 18px;
        transition: 0.3s;
    }

    a:hover {
        background: #0056b3;
        transform: scale(1.03);
    }
</style>

</head>
<body>

    <div class="container">
        <h1>Employee Management System</h1>
